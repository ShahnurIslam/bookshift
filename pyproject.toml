[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookshift"
version = "0.1.0b1"
description = "Progressive ebook ↔ audiobook synchronization (COARSE-first, FINE promotion)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "BookShift Contributors" }]
keywords = ["audiobook", "ebook", "sync", "koreader", "audiobookshelf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0,<9"]

[project.scripts]
bookshift = "bookshift.cli:main"

[project.urls]
Homepage = "https://github.com/bookshift/bookshift"
Documentation = "https://github.com/bookshift/bookshift#readme"
Repository = "https://github.com/bookshift/bookshift"

[tool.setuptools.packages.find]
include = ["bookshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
